name: 🐍 Generate Snake

on:
schedule:
- cron: "0 3 * * *"

workflow_dispatch:

push:
branches:
- main

jobs:
generate:
permissions:
contents: write

```
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Gerar cobrinha
    uses: Platane/snk@v3
    with:
      github_user_name: ${{ github.repository_owner }}
      outputs: |
        dist/github-contribution-grid-snake.svg?color_snake=#36BCF7
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#36BCF7
        dist/github-contribution-grid-snake.gif?color_snake=#36BCF7&color_dots=#0D1117,#0D5B78,#157F9E,#22A6C7,#36BCF7

  - name: Publicar cobrinha
    uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
    with:
      target_branch: output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
